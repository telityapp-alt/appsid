<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafuBot Proposal - Print Version</title>
  <style>
    @page {
      size: A4;
      margin: 0;
    }
    
    * {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    
    @media print {
      .page-break {
        page-break-after: always;
      }
      
      .no-break {
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body>
  <iframe 
    src="http://localhost:5173/for-safubot" 
    style="width: 1200px; height: 100vh; border: none; transform-origin: 0 0;"
    onload="window.print();"
  ></iframe>
</body>
</html>
